<!doctype html>
<!-- @dsCard group="Colors" name="Colors — Silver scale" subtitle="100 → 900 metallic neutrals" viewport="700x180" -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Falcon PM — Color: Silvers</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px; background: var(--bg); }
  .row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .swatch { border-radius: 6px; height: 96px; display: flex; flex-direction: column; justify-content: flex-end; padding: 10px; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.06); }
  .name { font-family: var(--font-body); font-size: 12px; font-weight: 700; }
  .hex { font-family: var(--font-mono); font-size: 10px; opacity: 0.7; }
</style>
</head>
<body>
  <div class="row">
    <div class="swatch" style="background: var(--silver-100); color: var(--ink);">
      <div class="name">100</div><div class="hex">#FAFAFA</div>
    </div>
    <div class="swatch" style="background: var(--silver-300); color: var(--ink);">
      <div class="name">300</div><div class="hex">#D9D9D9</div>
    </div>
    <div class="swatch" style="background: var(--silver-500); color: var(--ink);">
      <div class="name">500</div><div class="hex">#9C9C9C</div>
    </div>
    <div class="swatch" style="background: var(--silver-700); color: var(--bone);">
      <div class="name">700</div><div class="hex">#5E5E5E</div>
    </div>
    <div class="swatch" style="background: var(--silver-900); color: var(--bone);">
      <div class="name">900</div><div class="hex">#2C2D31</div>
    </div>
  </div>
</body>
</html>
