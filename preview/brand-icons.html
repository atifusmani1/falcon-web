<!doctype html>
<!-- @dsCard group="Brand" name="Brand — Iconography (Lucide)" subtitle="Canonical icon mappings, stroke 1.5" viewport="700x260" -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Falcon PM — Iconography</title>
<link rel="stylesheet" href="../colors_and_type.css">
<!-- Switched from Lucide → Phosphor (thin weight): less rounded, more
     sophisticated, hairline stroke. Loaded as a webfont via CDN. -->
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
<style>
  body { margin: 0; padding: 24px; background: var(--bg); font-family: var(--font-body); color: var(--ink); }
  .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 14px; }
  .cell {
    display: flex; flex-direction: column;
    align-items: center; gap: 8px;
    padding: 14px 6px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg-elev);
  }
  .label {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--silver-700);
    text-align: center;
    letter-spacing: 0.02em;
  }
  .icon { font-size: 30px; line-height: 1; color: var(--ink); }
</style>
</head>
<body>
  <div class="grid">
    <div class="cell"><i class="ph-thin ph-file-text icon"></i><div class="label">file‑text · Grant</div></div>
    <div class="cell"><i class="ph-thin ph-clipboard-text icon"></i><div class="label">clipboard · PM</div></div>
    <div class="cell"><i class="ph-thin ph-cpu icon"></i><div class="label">cpu · Tech</div></div>
    <div class="cell"><i class="ph-thin ph-hard-hat icon"></i><div class="label">hard‑hat · Build</div></div>
    <div class="cell"><i class="ph-thin ph-calendar icon"></i><div class="label">calendar</div></div>
    <div class="cell"><i class="ph-thin ph-bank icon"></i><div class="label">bank · budget</div></div>
    <div class="cell"><i class="ph-thin ph-target icon"></i><div class="label">target · scope</div></div>
    <div class="cell"><i class="ph-thin ph-shield-check icon"></i><div class="label">shield‑check</div></div>
    <div class="cell"><i class="ph-thin ph-trophy icon"></i><div class="label">trophy</div></div>
    <div class="cell"><i class="ph-thin ph-buildings icon"></i><div class="label">buildings · sectors</div></div>
    <div class="cell"><i class="ph-thin ph-envelope icon"></i><div class="label">envelope · mail</div></div>
    <div class="cell"><i class="ph-thin ph-arrow-right icon"></i><div class="label">arrow‑right</div></div>
  </div>
</body>
</html>
