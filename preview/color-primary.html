<!doctype html>
<!-- @dsCard group="Colors" name="Colors — Core" subtitle="Ink, Iron, Blood — the three anchors" viewport="700x200" -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Falcon PM — Color: Primary</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px; background: var(--bg); }
  .row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .swatch { border-radius: 8px; height: 120px; display: flex; flex-direction: column; justify-content: flex-end; padding: 12px; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.05); }
  .name { font-family: var(--font-body); font-size: 13px; font-weight: 700; }
  .hex { font-family: var(--font-mono); font-size: 11px; opacity: 0.8; }
  .dark .name, .dark .hex { color: var(--bone); }
  .light .name, .light .hex { color: var(--ink); }
</style>
</head>
<body>
  <div class="row">
    <div class="swatch dark" style="background: var(--ink);">
      <div class="name">Ink</div>
      <div class="hex">#0E0F12</div>
    </div>
    <div class="swatch dark" style="background: var(--silver-900);">
      <div class="name">Iron</div>
      <div class="hex">#2C2D31</div>
    </div>
    <div class="swatch dark" style="background: var(--blood);">
      <div class="name">Blood</div>
      <div class="hex">#691624</div>
    </div>
  </div>
</body>
</html>
