<!doctype html>
<!-- @dsCard group="Type" name="Type — Stats & numerals" subtitle="Aoboshi numerals + small‑caps labels" viewport="700x200" -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Falcon PM — Type: Stats</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 28px; background: var(--bg); }
  .row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
  .stat-block { border-left: 1px solid var(--border-strong); padding-left: 16px; }
  .n { font-family: var(--font-display); font-size: 72px; line-height: 1; color: var(--ink); letter-spacing: -0.02em; }
  .l { font-family: var(--font-body); font-size: 12px; text-transform: uppercase; letter-spacing: 0.16em; color: var(--silver-700); font-weight: 700; margin-top: 8px; }
</style>
</head>
<body>
  <div class="row">
    <div class="stat-block">
      <div class="n">$84M</div>
      <div class="l">Grant capital secured</div>
    </div>
    <div class="stat-block">
      <div class="n">47</div>
      <div class="l">Funded engagements</div>
    </div>
    <div class="stat-block">
      <div class="n" style="color: var(--blood);">100%</div>
      <div class="l">On‑schedule deliveries</div>
    </div>
  </div>
</body>
</html>
