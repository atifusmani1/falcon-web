<!doctype html>
<!-- @dsCard group="Spacing" name="Spacing — 8px scale" subtitle="4 / 8 / 12 / 16 / 24 / 32 / 48 / 64 / 96 / 128" viewport="700x360" -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Falcon PM — Spacing scale</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px; background: var(--bg); font-family: var(--font-body); color: var(--ink); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  td { padding: 6px 8px; vertical-align: middle; border-bottom: 1px solid var(--border); }
  .token { font-family: var(--font-mono); color: var(--silver-700); width: 110px; }
  .val { font-family: var(--font-mono); width: 70px; }
  .bar { background: var(--ink); height: 10px; border-radius: 2px; }
</style>
</head>
<body>
  <table>
    <tr><td class="token">--space-1</td><td class="val">4px</td><td><div class="bar" style="width:4px"></div></td></tr>
    <tr><td class="token">--space-2</td><td class="val">8px</td><td><div class="bar" style="width:8px"></div></td></tr>
    <tr><td class="token">--space-3</td><td class="val">12px</td><td><div class="bar" style="width:12px"></div></td></tr>
    <tr><td class="token">--space-4</td><td class="val">16px</td><td><div class="bar" style="width:16px"></div></td></tr>
    <tr><td class="token">--space-5</td><td class="val">24px</td><td><div class="bar" style="width:24px"></div></td></tr>
    <tr><td class="token">--space-6</td><td class="val">32px</td><td><div class="bar" style="width:32px"></div></td></tr>
    <tr><td class="token">--space-7</td><td class="val">48px</td><td><div class="bar" style="width:48px"></div></td></tr>
    <tr><td class="token">--space-8</td><td class="val">64px</td><td><div class="bar" style="width:64px"></div></td></tr>
    <tr><td class="token">--space-9</td><td class="val">96px</td><td><div class="bar" style="width:96px"></div></td></tr>
    <tr><td class="token">--space-10</td><td class="val">128px</td><td><div class="bar" style="width:128px"></div></td></tr>
  </table>
</body>
</html>
