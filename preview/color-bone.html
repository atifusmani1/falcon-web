<!doctype html>
<!-- @dsCard group="Colors" name="Colors — Bone (parchment)" subtitle="Warm light backgrounds & surfaces" viewport="700x180" -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Falcon PM — Color: Bone (parchment)</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px; background: #fff; }
  .row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .swatch { border-radius: 6px; height: 96px; display: flex; flex-direction: column; justify-content: flex-end; padding: 10px; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.08); color: var(--ink); }
  .name { font-family: var(--font-body); font-size: 12px; font-weight: 700; }
  .hex { font-family: var(--font-mono); font-size: 10px; opacity: 0.7; }
</style>
</head>
<body>
  <div class="row">
    <div class="swatch" style="background: #FBFAF7;"><div class="name">bg-elev</div><div class="hex">#FBFAF7</div></div>
    <div class="swatch" style="background: var(--bone);"><div class="name">Bone</div><div class="hex">#F4F2EE</div></div>
    <div class="swatch" style="background: var(--bone-2);"><div class="name">Bone 2</div><div class="hex">#E9E6E0</div></div>
    <div class="swatch" style="background: var(--bone-3);"><div class="name">Bone 3</div><div class="hex">#DCD8D0</div></div>
  </div>
</body>
</html>
